name: "dockit"
arch: "amd64"
platform: "linux"
version: "${VERSION}"
section: "utils"
priority: "optional"
maintainer: "Amanbig <amanpreetsinghjhiwant@outlook.com>"
description: "Cross-platform Docker & Podman desktop management"
homepage: "https://github.com/Amanbig/dockit"
license: "Apache-2.0"

contents:
  - src: ../bin/dockit
    dst: /usr/bin/dockit
    file_info:
      mode: 0755
  - src: dockit.desktop
    dst: /usr/share/applications/dockit.desktop
  - src: ../appicon.png
    dst: /usr/share/icons/hicolor/512x512/apps/dockit.png

depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
