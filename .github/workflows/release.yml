name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            output_name: dockit-linux-amd64

          - os: windows-latest
            platform: windows/amd64
            output_name: dockit-windows-amd64

          - os: macos-latest
            platform: darwin/universal
            output_name: dockit-darwin-universal

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24'
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Setup NSIS (Windows)
        if: runner.os == 'Windows'
        uses: nsis-dev/setup-nsis@v1

      - name: Install Packaging Tools
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          if [ "${{ runner.os }}" = "Linux" ]; then
            go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          fi

      - name: Build Wails Application
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            wails build -tags webkit2_41 -platform ${{ matrix.platform }} -ldflags "-X 'dockit/internal/version.Version=${{ github.ref_name }}'"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            for p in "/c/Program Files/NSIS" "/c/Program Files/NSIS/Bin" "/c/Program Files (x86)/NSIS" "/c/Program Files (x86)/NSIS/Bin" "/c/ProgramData/chocolatey/bin"; do
              if [ -d "$p" ]; then
                export PATH="$p:$PATH"
              fi
            done
            echo "Verifying NSIS installation:"
            which makensis || which makensis.exe || true
            makensis -VERSION || makensis /VERSION || true
            wails build -nsis -platform ${{ matrix.platform }} -ldflags "-X 'dockit/internal/version.Version=${{ github.ref_name }}'"
          else
            wails build -platform ${{ matrix.platform }} -ldflags "-X 'dockit/internal/version.Version=${{ github.ref_name }}'"
          fi

      - name: Package Linux Binary and Native Installers (.deb, .rpm, .tar.gz)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Create standalone tarball
          tar -czvf dockit-linux-amd64.tar.gz -C build/bin dockit
          
          # Create native .deb and .rpm packages
          VERSION_CLEAN="${GITHUB_REF_NAME#v}"
          cd build/linux
          VERSION="${VERSION_CLEAN:-0.0.0}" nfpm package --config nfpm.yaml --packager deb --target ../../dockit-linux-amd64.deb
          VERSION="${VERSION_CLEAN:-0.0.0}" nfpm package --config nfpm.yaml --packager rpm --target ../../dockit-linux-amd64.rpm
          cd ../..

      - name: Package Windows Binary (.zip) and NSIS Installer (.exe)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Standalone zipped portable executable
          cd build/bin && 7z a ../../dockit-windows-amd64.zip dockit.exe && cd ../..
          # Find NSIS setup wizard installer
          ls -la build/bin/
          INSTALLER_FILE=$(find build/bin -type f -name "*installer*.exe" | head -n 1)
          if [ -z "$INSTALLER_FILE" ]; then
            echo "Warning: NSIS installer was not found in build/bin/. Trying manual makensis compilation..."
            for p in "/c/Program Files/NSIS" "/c/Program Files/NSIS/Bin" "/c/Program Files (x86)/NSIS" "/c/Program Files (x86)/NSIS/Bin" "/c/ProgramData/chocolatey/bin"; do
              if [ -d "$p" ]; then
                export PATH="$p:$PATH"
              fi
            done
            if [ -f "build/windows/installer/project.nsi" ]; then
              cd build/windows/installer
              makensis -DARG_WAILS_AMD64_BINARY=..\..\bin\dockit.exe project.nsi || true
              cd ../../..
            fi
            INSTALLER_FILE=$(find build/bin -type f -name "*installer*.exe" | head -n 1)
          fi

          if [ -n "$INSTALLER_FILE" ]; then
            cp "$INSTALLER_FILE" "dockit-windows-amd64-installer.exe"
            echo "Successfully packaged: dockit-windows-amd64-installer.exe"
          else
            echo "ERROR: NSIS installer was not generated in build/bin!" >&2
            exit 1
          fi

      - name: Package macOS Application (.zip) and Installer (.dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Standalone zipped application bundle
          cd build/bin && zip -r ../../dockit-darwin-universal.zip dockit.app && cd ../..
          
          # Create DMG installer
          brew install create-dmg || true
          create-dmg \
            --volname "Dockit" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "dockit.app" 175 160 \
            --hide-extension "dockit.app" \
            --app-drop-link 425 160 \
            dockit-darwin-universal.dmg \
            build/bin/dockit.app || hdiutil create -volname "Dockit" -srcfolder build/bin/dockit.app -ov -format UDZO dockit-darwin-universal.dmg

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: |
            dockit-*.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Artifacts
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
